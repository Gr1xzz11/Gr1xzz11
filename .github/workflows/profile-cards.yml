name: Generate profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"
  push:
    paths:
      - ".github/workflows/profile-cards.yml"
      - ".github/scripts/generate_profile_stats.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVG cards from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Gr1xzz11
        run: python .github/scripts/generate_profile_stats.py

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update profile stats"
          git push
