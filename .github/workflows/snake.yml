name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * *"
  push:
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Gr1xzz11
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#7C3AED
            dist/github-contribution-grid-snake-light.svg?color_snake=#2563EB

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
