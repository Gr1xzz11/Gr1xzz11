name: GRXT Math APK

on:
  push:
    branches: [grxt-math-build]
    paths:
      - 'GRXT-Math-build/src/**'
      - '.github/workflows/grxt-math-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grxt-math-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: grxt-math-build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and publish result
        shell: bash
        run: |
          set +e
          LOG=/tmp/grxt-math-build.log
          (
            set -euo pipefail
            rm -rf GRXT-Math
            cat \
              GRXT-Math-build/src/chunk-00.b64 \
              GRXT-Math-build/src/chunk-01.b64 \
              GRXT-Math-build/src/chunk-02a.b64 \
              GRXT-Math-build/src/chunk-02b.b64 \
              GRXT-Math-build/src/chunk-02c.b64 \
              GRXT-Math-build/src/chunk-02d.b64 \
              GRXT-Math-build/src/chunk-03.b64 \
              GRXT-Math-build/src/chunk-04.b64 \
              GRXT-Math-build/src/chunk-05.b64 \
              | base64 --decode > /tmp/GRXT-Math.zip

            echo '3a6b5ab316edb36719266f4b6afe709c27d16c284f8465633b0b7006680f8404  /tmp/GRXT-Math.zip' | sha256sum -c -
            unzip -t /tmp/GRXT-Math.zip
            unzip -q /tmp/GRXT-Math.zip -d .
            test -f GRXT-Math/settings.gradle.kts

            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              'platform-tools' \
              'platforms;android-37' \
              'build-tools;37.0.0'

            cd GRXT-Math
            chmod +x gradlew
            ./gradlew --no-daemon :math-core:test :app:assembleDebug
          ) >"$LOG" 2>&1
          RC=$?
          set -e

          OUT=GRXT-Math-build/output
          mkdir -p "$OUT"
          rm -f "$OUT/GRXT-Math-0.1.0-debug.apk" \
                "$OUT/GRXT-Math-0.1.0-debug.apk.sha256" \
                "$OUT/BUILD_FAILED.log" \
                "$OUT/status.txt"

          if [ "$RC" -eq 0 ] && [ -f GRXT-Math/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp GRXT-Math/app/build/outputs/apk/debug/app-debug.apk \
               "$OUT/GRXT-Math-0.1.0-debug.apk"
            sha256sum "$OUT/GRXT-Math-0.1.0-debug.apk" \
              > "$OUT/GRXT-Math-0.1.0-debug.apk.sha256"
            printf 'SUCCESS\n' > "$OUT/status.txt"
          else
            cp "$LOG" "$OUT/BUILD_FAILED.log"
            printf 'FAILED (exit %s)\n' "$RC" > "$OUT/status.txt"
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          git commit -m 'build: GRXT Math result [skip ci]' || true
          git push origin HEAD:grxt-math-build

          exit "$RC"
